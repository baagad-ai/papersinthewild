<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Papers in the Wild">
  <!--
    PITW default Open Graph image. 1200×630 per Facebook/Twitter spec.
    For per-episode OG images, use scripts/generate-og.mjs with og-template.html.
    All fonts have safe fallbacks (Georgia for Fraunces, monospace for Plex Mono)
    so this SVG renders acceptably in any SVG-aware context without external fonts.
  -->
  <!-- Background -->
  <rect width="1200" height="630" fill="#F5EFE0" />

  <!-- Top-left: compact wordmark + seal -->
  <g transform="translate(64, 56)">
    <!-- Compact wordmark: papers in the wild (lowercase Plex Mono) -->
    <text x="0" y="20" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="16" font-weight="500" fill="#1A1612" letter-spacing="0.5">papers in the wild</text>
    <!-- Oxblood seal square (miniature) -->
    <rect x="180" y="6" width="14" height="14" fill="#7C2D2D" />
  </g>

  <!-- Top-right: EP. XX badge (for per-episode use; default shows "EST. 2026") -->
  <g transform="translate(1136, 56)">
    <text x="0" y="20" text-anchor="end" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="12" font-weight="500" fill="#6B5F4F" letter-spacing="2">EST. 2026</text>
  </g>

  <!-- Ink rule below header -->
  <rect x="64" y="100" width="6" height="6" fill="#7C2D2D" />
  <line x1="76" y1="103" x2="1136" y2="103" stroke="#C9BFA7" stroke-width="1" />

  <!-- Center: wordmark in Fraunces-style (falls back to Georgia if Fraunces unavailable) -->
  <text x="64" y="300" font-family="'Fraunces', Georgia, serif" font-size="84" font-weight="500" font-style="italic" fill="#1A1612">Papers in the Wild</text>

  <!-- Tagline -->
  <text x="64" y="370" font-family="'Source Serif 4', Georgia, serif" font-size="28" fill="#3C342B">Read the paper. Try something. Ship the receipts.</text>

  <!-- Bottom ink rule -->
  <rect x="64" y="510" width="6" height="6" fill="#7C2D2D" />
  <line x1="76" y1="513" x2="1136" y2="513" stroke="#C9BFA7" stroke-width="1" />

  <!-- Bottom: URL + cadence -->
  <text x="64" y="555" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="14" fill="#6B5F4F" letter-spacing="1.5">papersinthewild.io</text>
  <text x="1136" y="555" text-anchor="end" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="14" fill="#6B5F4F" letter-spacing="2">ONE EPISODE · EVERY FRIDAY</text>

  <!-- Large oxblood seal in bottom-right corner (subtle, large, opacity 0.15) -->
  <g transform="translate(980, 410)" opacity="0.15">
    <circle cx="100" cy="100" r="80" fill="none" stroke="#7C2D2D" stroke-width="3" />
    <text x="100" y="115" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="36" font-weight="500" letter-spacing="4" fill="#7C2D2D">PITW</text>
  </g>
</svg>

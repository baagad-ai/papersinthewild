name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, cancel runs in-progress.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: projects/ai-papers-explained/site/package-lock.json

      - name: Install dependencies
        working-directory: projects/ai-papers-explained/site
        # --legacy-peer-deps because framer-motion@11 peer-deps react@^18
        # while the project is on react@19. Local installs work because
        # npm install is more lenient than npm ci.
        run: npm ci --legacy-peer-deps

      - name: Build with Next.js
        working-directory: projects/ai-papers-explained/site
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: projects/ai-papers-explained/site/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

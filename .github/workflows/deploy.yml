name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, cancel runs in-progress.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Content gates (em-dash ban + episode registry consistency)
        run: |
          set -e
          echo "== em-dash/en-dash scan (reader-facing prose) =="
          if grep -rn '—\|–' site/content/episodes/*.mdx episodes/*/blog-post.md 2>/dev/null; then
            echo "FAIL: banned dash characters in shipped prose (STYLE-GUIDE §7)."
            exit 1
          fi
          echo "== episode registry consistency =="
          for slug in $(grep -o 'slug: "[^"]*"' site/content/episodes.ts | cut -d'"' -f2); do
            if [ ! -f "site/content/episodes/$slug.mdx" ]; then
              echo "FAIL: '$slug' registered in episodes.ts but site/content/episodes/$slug.mdx is missing."
              exit 1
            fi
          done
          echo "GATES PASS"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        # --legacy-peer-deps because framer-motion@11 peer-deps react@^18
        # while the project is on react@19. Local installs work because
        # npm install is more lenient than npm ci.
        run: npm ci --legacy-peer-deps

      - name: Build with Next.js
        working-directory: site
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
